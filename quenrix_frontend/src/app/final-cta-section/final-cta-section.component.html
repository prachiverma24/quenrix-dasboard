<section class="final-cta-section">
  <div class="container">
    <div class="cta-card">
      <h2>Ready to transform your future?</h2>
      <p>
        Join thousands of students and start your journey towards a successful career in tech today.
        <br>
        Our next cohort starts soon!
      </p>

      <div class="cta-actions">
        <button class="btn btn-light">Start Free Career Assessment</button>
        <button class="btn btn-outline">Join Discord Community</button>
      </div>

      <div class="cta-features">
        <span *ngFor="let item of highlights">◉ {{ item }}</span>
      </div>
    </div>
  </div>
</section>
