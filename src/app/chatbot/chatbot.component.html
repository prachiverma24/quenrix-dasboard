<div class="chat-container">
  <div class="quick-questions" *ngIf="!isTyping">
    <button
      type="button"
      class="quick-chip"
      *ngFor="let q of quickQuestions"
      (click)="askQuickQuestion(q)">
      {{ q }}
    </button>
  </div>

  <div class="chat-box" #chatBox>
    <div *ngFor="let msg of messages" [ngClass]="msg.sender">
      <p>{{ msg.text }}</p>
    </div>

    <div class="bot typing" *ngIf="isTyping">
      <p>
        <span></span><span></span><span></span>
      </p>
    </div>
  </div>

  <div class="input-box">
    <input [(ngModel)]="userInput" [placeholder]="t('chat.inputPlaceholder')" (keyup.enter)="sendMessage()" [disabled]="isTyping" />
    <button (click)="sendMessage()" [disabled]="isTyping">{{ isTyping ? '...' : t('chat.send') }}</button>
  </div>
</div>
