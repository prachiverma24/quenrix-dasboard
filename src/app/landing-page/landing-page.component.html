<div class="landing-page">


  <!-- 
    1. Header: Navigation signals receive karega.
  -->
  <app-header [activePage]="currentView" (pageChange)="onPageChange($event)"></app-header>
  
  <!-- 
    2. HOME VIEW
    Modern Hero Section + Stats Section + Navbar (Batches)
  -->
  <div *ngIf="currentView === 'home'" class="fade-in-view">
    <app-hero-section></app-hero-section>
    <app-courses-page></app-courses-page>
    <app-demo-classes-section></app-demo-classes-section>
    <app-navbar></app-navbar> 
  </div>

  <!-- 
    3. CONTACT VIEW
    Smooth fade-in animation ke saath contact page
  -->
  <div *ngIf="currentView === 'contact'" class="fade-in-view">
    <app-contact></app-contact>
  </div>

  <!-- 
    4. BLOG VIEW
    Ye section ab 'blog' click karne par smoothly open hoga.
  -->
  <div *ngIf="currentView === 'blog'" class="fade-in-view">
    <app-blog></app-blog>
  </div>

  <!-- 
    5. CAREERS VIEW (NEW ADDITION)
    Ab careers page bhi header se open hoga.
  -->
  <div *ngIf="currentView === 'careers'" class="fade-in-view">
    <app-careers></app-careers>
  </div>

  <!-- COURSES VIEW -->
  <div *ngIf="currentView === 'courses'" class="fade-in-view pt-20">
    <app-courses-page></app-courses-page>
  </div>

  <!-- 
    6. FOOTER
    Footer hamesha content ke neeche rahega.
  -->
  <app-footer></app-footer>

  <app-about-csmit
    *ngIf="isAboutModalOpen"
    [isVisible]="isAboutModalOpen"
    [trainers]="trainers"
    (closeModal)="closeAboutModal()">
  </app-about-csmit>

  <!-- Advisor Modal -->
  <div *ngIf="isAdvisorModalOpen" class="fixed inset-0 z-[1000] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" (click)="closeAdvisorModal()">
    <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl shadow-2xl w-full max-w-lg p-6 text-white relative" (click)="$event.stopPropagation()">
      <!-- Close Button -->
      <button class="absolute top-4 right-4 text-white/70 hover:text-white" (click)="closeAdvisorModal()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>

      <h2 class="text-2xl font-bold mb-2">Get In Touch</h2>
      <p class="text-white/70 mb-6">Talk to our career advisor to find the best path for you.</p>

      <form class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-white/80 mb-1">Name</label>
          <input type="text" class="w-full bg-white/5 border border-white/10 rounded-lg py-2 px-3 text-white placeholder-white/30 focus:outline-none focus:border-purple-500 focus:bg-white/10" placeholder="John Doe">
        </div>
        <div>
          <label class="block text-sm font-medium text-white/80 mb-1">Email</label>
          <input type="email" class="w-full bg-white/5 border border-white/10 rounded-lg py-2 px-3 text-white placeholder-white/30 focus:outline-none focus:border-purple-500 focus:bg-white/10" placeholder="john@example.com">
        </div>
        <div>
          <label class="block text-sm font-medium text-white/80 mb-1">Phone Number</label>
          <input type="tel" class="w-full bg-white/5 border border-white/10 rounded-lg py-2 px-3 text-white placeholder-white/30 focus:outline-none focus:border-purple-500 focus:bg-white/10" placeholder="+1 234 567 890">
        </div>
        <div>
          <label class="block text-sm font-medium text-white/80 mb-1">Message</label>
          <textarea class="w-full bg-white/5 border border-white/10 rounded-lg py-2 px-3 text-white placeholder-white/30 focus:outline-none focus:border-purple-500 focus:bg-white/10 h-24" placeholder="How can we help you?"></textarea>
        </div>
        
        <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold py-3 rounded-lg hover:shadow-purple-500/30 transform hover:-translate-y-0.5 transition duration-300">Submit</button>
      </form>

      <div class="mt-6 pt-4 border-t border-white/10 flex justify-center gap-4">
        <a href="https://wa.me/yournumber" target="_blank" class="flex items-center gap-2 text-white/70 hover:text-white transition">
          <span class="text-green-400">WhatsApp</span>
          <span>💬</span>
        </a>
        <a href="mailto:advisor@quenrix.com" class="flex items-center gap-2 text-white/70 hover:text-white transition">
          <span>Email Us</span>
          <span>✉️</span>
        </a>
      </div>
    </div>
  </div>
</div>
